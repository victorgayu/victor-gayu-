document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

: rgba(196,168,122,0.75);\n    }\n    input, textarea {\n      background: transparent;\n      border: 1px solid rgba(196,168,122,0.2);\n      color: var(--bone);\n      font-family: var(--font-b);\n      font-size: 13px;\n      letter-spacing: 0.04em;\n      padding: 15px 18px;\n      outline: none;\n      transition: border-color 0.3s, background 0.3s;\n      width: 100%;\n    }\n    input:focus, textarea:focus {\n      border-color: var(--gold);\n      background: var(--gold-dim);\n    }\n    input::placeholder, textarea::placeholder { color: rgba(240,237,232,0.22); }\n    textarea { resize: vertical; min-height: 140px; }\n    .submit-btn {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      background: var(--gold);\n      color: var(--black);\n      border: none;\n      padding: 18px 26px;\n      font-family: var(--font-b);\n      font-size: 11px;\n      letter-spacing: 0.3em;\n      text-transform: uppercase;\n      cursor: pointer;\n      margin-top: 8px;\n      transition: background 0.3s, transform 0.2s;\n    }\n    .submit-btn:hover { background: var(--bone); transform: translateY(-2px); }\n    .submit-btn .arrow { font-size: 15px; transition: transform 0.3s; }\n    .submit-btn:hover .arrow { transform: translateX(6px); }\n\n    .form-success { display: none; text-align: center; padding: 56px 24px; }\n    .form-success.visible { display: block; }\n    .form-success-icon {\n      font-family: var(--font-h);\n      font-size: 56px;\n      color: var(--gold);\n      margin-bottom: 18px;\n    }\n    .form-success-title {\n      font-family: var(--font-h);\n      font-size: 28px;\n      letter-spacing: 0.1em;\n      color: var(--bone);\n      margin-bottom: 12px;\n    }\n    .form-success-text {\n      font-size: 12px;\n      line-height: 1.9;\n      color: rgba(240,237,232,0.5);\n    }\n\n    @media (max-width: 900px) {\n      #credibility { flex-direction: column; align-items: flex-start; gap: 18px; padding: 48px 24px; }\n      #el-trabajo, #form-section { padding: 90px 24px; }\n      .form-inner { grid-template-columns: 1fr; gap: 56px; }\n    }\n    @media (max-width: 600px) {\n      #credibility { padding: 36px 22px; }\n      #el-trabajo, #form-section { padding: 70px 22px; }\n      .form-intro-title { font-size: clamp(34px, 9vw, 48px); }\n      .form-note { padding: 14px 16px; font-size: 11.5px; }\n      .whatsapp-btn { width: 100%; justify-content: center; padding: 14px 18px; }\n      input, textarea { font-size: 14px; padding: 14px 16px; }\n      textarea { min-height: 120px; }\n      .submit-btn { padding: 16px 22px; font-size: 10px; letter-spacing: 0.26em; }\n      .el-trabajo-cta { justify-content: stretch; }\n      .el-trabajo-cta .btn-ghost { width: 100%; justify-content: center; }\n    }\n\n    /* ══════════════════════════════════════════════════\n       §6  CTA FINAL\n    ══════════════════════════════════════════════════ */\n    #cta-final {\n      padding: 140px 10vw;\n      background: var(--black);\n      text-align: center;\n      border-top: 1px solid rgba(196,168,122,0.08);\n      position: relative;\n      overflow: hidden;\n    }\n    #cta-final::before {\n      content: '';\n      position: absolute;\n      top: 50%; left: 50%;\n      transform: translate(-50%, -50%);\n      width: 600px; height: 600px;\n      border-radius: 50%;\n      background: radial-gradient(circle, rgba(196,168,122,0.08) 0%, transparent 70%);\n      pointer-events: none;\n    }\n    .cta-final-headline {\n      font-family: var(--font-h);\n      font-size: clamp(48px, 8vw, 110px);\n      line-height: 0.92;\n      letter-spacing: 0.02em;\n      text-transform: uppercase;\n      color: var(--bone);\n      margin-bottom: 28px;\n      position: relative;\n    }\n    .cta-final-sub {\n      font-size: 13px;\n      line-height: 1.85;\n      color: rgba(240,237,232,0.55);\n      max-width: 520px;\n      margin: 0 auto 48px;\n      position: relative;\n    }\n    .cta-buttons {\n      display: flex;\n      gap: 12px;\n      justify-content: center;\n      flex-wrap: wrap;\n      position: relative;\n    }\n    .cta-microcopy {\n      margin-top: 36px;\n      font-size: 10px;\n      letter-spacing: 0.22em;\n      text-transform: uppercase;\n      color: rgba(240,237,232,0.3);\n      position: relative;\n    }\n    .cta-microcopy span { margin: 0 10px; color: var(--gold); }\n\n    /* ── FOOTER ─────────────────────────────────────── */\n    footer {\n      padding: 32px 48px;\n      border-top: 1px solid rgba(240,237,232,0.06);\n      display: flex;\n      justify-content: space-between;\n      align-items: center;\n      gap: 20px;\n    }\n    footer .foot-logo {\n      font-family: var(--font-h);\n      font-size: 16px;\n      letter-spacing: 0.18em;\n      color: rgba(240,237,232,0.3);\n      text-decoration: none;\n    }\n    footer .foot-location {\n      font-family: var(--font-b);\n      font-size: 10px;\n      letter-spacing: 0.2em;\n      text-transform: uppercase;\n      color: rgba(240,237,232,0.3);\n      text-decoration: none;\n      transition: color 0.2s;\n    }\n    footer .foot-location:hover { color: var(--gold); }\n    footer .foot-meta {\n      font-size: 10px;\n      letter-spacing: 0.15em;\n      color: rgba(240,237,232,0.2);\n    }\n\n    /* ── WHATSAPP FLOAT ─────────────────────────────── */\n    #wa-float {\n      position: fixed;\n      bottom: 24px; right: 24px;\n      z-index: 500;\n      width: 56px; height: 56px;\n      background: #128c7e;\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      text-decoration: none;\n      transition: transform 0.2s, background 0.2s;\n      box-shadow: 0 4px 20px rgba(0,0,0,0.5);\n    }\n    #wa-float:hover { transform: scale(1.08); background: #25d366; }\n    #wa-float svg { width: 28px; height: 28px; fill: white; }\n\n    /* ── RESPONSIVE ─────────────────────────────────── */\n    @media (max-width: 900px) {\n      #nav { padding: 16px 24px; }\n  ── STICKY NAV ─────────────────────────────────── -->\n  <nav id=\"nav\">\n    <a href="/" class=\"nav-logo\">VÍCTOR GAYÚ<\u002Fa>\n    <div style=\"display:flex; align-items:center; gap:18px;\">\n      <div class=\"lang-toggle\">\n        <button type=\"button\" data-lang=\"es\" class=\"active\">ES<\u002Fbutton>\n        <span class=\"lang-sep\">/<\u002Fspan>\n        <button type=\"button\" data-lang=\"en\">EN<\u002Fbutton>\n      <\u002Fdiv>\n      <a href="/" class=\"nav-back\" data-en=\"Back\">Volver<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fnav>\n\n  <!-- ══════════════════════════════════════════════════\n       §1 HERO\n  ══════════════════════════════════════════════════ -->\n  <section id=\"hero\">\n    <div class=\"hero-content\">\n      <p class=\"hero-eyebrow reveal\" data-en=\"Exclusive service · Mallorca\">Servicio exclusivo · Mallorca<\u002Fp>\n      <h1 class=\"hero-headline reveal reveal-delay-1\">\n        Private<br><span>Session<\u002Fspan>\n      <\u002Fh1>\n      <p class=\"hero-sub reveal reveal-delay-2\" data-en=\"High-end tattooing in your villa, estate, hotel or yacht. No studio. No shared schedule. Just you, the work, and the environment you choose.\">\n        Tatuaje de alto nivel en tu villa, finca, hotel o yate. Sin estudio. Sin agenda compartida. Solo tú, el trabajo, y el entorno que elijas.\n      <\u002Fp>\n      <div class=\"hero-ctas reveal reveal-delay-3\">\n        <a href=\"#form-section\" class=\"btn-primary\" data-en=\"Request session\">Solicitar sesión<\u002Fa>\n        <a href=\"#how\" class=\"btn-ghost\" data-en=\"How it works\">Cómo funciona<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════════════════════════════════════════════\n       §1.5 CREDIBILIDAD\n  ══════════════════════════════════════════════════ -->\n  <div id=\"credibility\" class=\"reveal\">\n    <div class=\"cred-line\"><\u002Fdiv>\n    <p class=\"cred-text\">\n      <span data-en=\"&lt;strong&gt;I work with clients who know what they want&lt;/strong&gt; and value the process as much as the result. Limited availability per season.\"><strong>Trabajo con clientes que saben lo que quieren<\u002Fstrong> y valoran el proceso tanto como el resultado. Disponibilidad limitada por temporada.<\u002Fspan>\n    <\u002Fp>\n  <\u002Fdiv>\n\n  <!-- ══════════════════════════════════════════════════\n       §2 WHAT\n  ══════════════════════════════════════════════════ -->\n  <section id=\"what\">\n    <p class=\"section-tag reveal\" data-en=\"What it is\">Qué es<\u002Fp>\n    <div class=\"what-grid\">\n      <h2 class=\"what-title reveal\" data-en=\"Private tattooing,&lt;br&gt;uninterrupted.\">Tatuaje privado,<br>sin interrupciones.<\u002Fh2>\n      <div class=\"what-body reveal reveal-delay-1\">\n        <p data-en=\"A session designed for those who value discretion, time, and the process as much as the final result. I bring the complete technical setup to wherever you are, maintaining the same professional conditions as in the studio.\">Una sesión diseñada para quienes valoran la discreción, el tiempo y el proceso tanto como el resultado final. Llevo el entorno técnico completo hasta donde estés, manteniendo las mismas condiciones profesionales que en estudio.<\u002Fp>\n        <p data-en=\"The studio comes to you. No interruptions, no shared schedule, no compromises on the quality of the work.\">El estudio va a ti. Sin interrupciones, sin agenda compartida, sin concesiones en la calidad del trabajo.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════════════════════════════════════════════\n       §3 PILLARS\n  ══════════════════════════════════════════════════ -->\n  <section id=\"pillars\">\n    <div class=\"pillars-grid reveal\">\n      <div class=\"pillar\">\n        <div class=\"pillar-num\">01<\u002Fdiv>\n        <div class=\"pillar-title\" data-en=\"Complete setup\">Setup completo<\u002Fdiv>\n        <p class=\"pillar-text\" data-en=\"Machine, inks, sterile needles, professional lighting. The same conditions as in the studio, wherever you are.\">Máquina, tintas, agujas estériles, iluminación profesional. Las mismas condiciones que en estudio, donde tú estés.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"pillar\">\n        <div class=\"pillar-num\">02<\u002Fdiv>\n        <div class=\"pillar-title\" data-en=\"Total privacy\">Total privacidad<\u002Fdiv>\n        <p class=\"pillar-text\" data-en=\"Just you, the environment you choose, and the work. No other clients, no waiting, no shared space.\">Solo tú, el entorno que elijas y el trabajo. Sin otros clientes, sin esperas, sin espacio compartido.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"pillar\">\n        <div class=\"pillar-num\">03<\u002Fdiv>\n        <div class=\"pillar-title\" data-en=\"Custom design\">Diseño a medida<\u002Fdiv>\n        <p class=\"pillar-text\" data-en=\"Each piece is developed from scratch for you. Prior consultation included to define the design with no commitment.\">Cada pieza se desarrolla desde cero para ti. Consulta previa incluida para definir el diseño sin compromiso.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════════════════════════════════════════════\n       §4 HOW\n  ══════════════════════════════════════════════════ -->\n  <section id=\"how\">\n    <p class=\"section-tag reveal\" data-en=\"How it works\">Cómo funciona<\u002Fp>\n    <div class=\"how-steps\">\n      <div class=\"how-step reveal\">\n        <div class=\"how-step-num\">01<\u002Fdiv>\n        <div>\n          <div class=\"how-step-title\" data-en=\"You get in touch\">Contactas<\u002Fdiv>\n          <p class=\"how-step-text\" data-en=\"Via form or WhatsApp. Tell me what you have in mind, where you are, and when. You don't need to have everything figured out.\">Por formulario o por WhatsApp. Cuéntame qué tienes en mente, dónde estás y cuándo. No hace falta tenerlo todo definido.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n rivate session.\">No es solo<br>una sesión privada.<\u002Fh2>\n      <div class=\"what-body reveal reveal-delay-1\">\n        <p data-en=\"Each project is designed from scratch, considering anatomy, movement, composition, and how it will age. I don't adapt existing images — I build pieces specifically thought out for the person and the body part where they'll live.\">Cada proyecto se diseña desde cero, teniendo en cuenta anatomía, movimiento, composición y permanencia en el tiempo. No adapto imágenes existentes — construyo piezas pensadas específicamente para la persona y el lugar del cuerpo donde van a vivir.<\u002Fp>\n        <p data-en=\"If you're looking for privacy, any tattooist can travel. If you're looking for artistic judgment, the process is different from the very first moment.\">Si buscas privacidad, cualquier tatuador puede desplazarse. Si buscas criterio artístico, el proceso es diferente desde el primer momento.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"el-trabajo-cta reveal reveal-delay-2\">\n      <a href=\"https://www.instagram.com/victor.gayu/\" class=\"btn-ghost\" target=\"_blank\" rel=\"noopener\">\n        <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"currentColor\" style=\"margin-right:2px;\"><path d=\"M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.2
